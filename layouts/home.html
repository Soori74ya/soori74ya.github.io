<html lang="en">
{{ partial "head.html" . }}

<body>
    <div class="container home">
        {{ partial "nav.html" . }}
        <main>
            <div class="left">
                <ul class="works-ul">
                    {{ range sort (where .Site.RegularPages "Section" "works") "Date" "desc" }}
                    <li data-thumbnail="{{ .Site.BaseURL }}{{ .Params.thumbnail }}">
                        <a href="{{ .RelPermalink }}">
                            {{ .Title }}
                        </a>
                    </li>
                    {{ end }}
                </ul>
            </div>
            <div class="right">
                <div class="thumbnail">
                    <img class="preview-image" src="" alt="">
                </div>
            </div>
        </main>
    </div>
<script>
        const backgrounds = {{ with .Site.GetPage "/backgrounds" }}
            {{ dict
                "landscape" .Params.landscape
                "portrait" .Params.portrait
                | jsonify | safeJS
            }}
        {{ else }}
            {"landscape":[],"portrait":[]}
        {{ end }};
    
        const baseURL = {{ .Site.BaseURL | jsonify | safeJS }};
    
        const isMobile = () => window.innerWidth <= 768;
    
        const setBackground = (mobile) => {
            const images = mobile
                ? backgrounds.portrait
                : backgrounds.landscape;
    
            if (!images || images.length === 0) {
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = "#fff";
                return;
            }
    
            const random = Math.floor(Math.random() * images.length);
            const imageURL = new URL(images[random], baseURL);
    
            document.body.style.backgroundImage = `url("${imageURL.href}")`;
            document.body.style.backgroundColor = "#fff";
            document.body.style.backgroundRepeat = "no-repeat";
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundSize = "cover";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const mobile = isMobile();
            setBackground(mobile);

            const menus = document.querySelectorAll(".menus span");
            const gap = 50;
            const padding = 20;

            const positions = [];

            for (const menu of menus) {
                menu.style.position = "fixed";

                const width = menu.offsetWidth;
                const height = menu.offsetHeight;

                let x, y;
                let tries = 0;

                do {
                    x = padding + Math.random() * (window.innerWidth - width - padding * 2);
                    y = padding + Math.random() * (window.innerHeight - height - padding * 2);

                    tries++;

                    const overlap = positions.some(pos => {
                        return !(
                            x + width + gap < pos.x ||
                            x - gap > pos.x + pos.width ||
                            y + height + gap < pos.y ||
                            y - gap > pos.y + pos.height
                        );
                    });

                    if (!overlap) break;

                } while (tries < 1000);

                menu.style.left = `${x}px`;
                menu.style.top = `${y}px`;

                positions.push({
                    x,
                    y,
                    width,
                    height
                });
            }

            for (const menu of menus) {
                menu.style.visibility = "visible";
            }
        });
    </script>

</html>
