<html lang="en">
    {{ partial "head.html" . }}
    <body>
        <div class="container contact">
            {{ partial "nav.html" . }}
            <main>
                <p>
                    <a href="mailto:{{ .Params.email }}">
                        {{ .Params.email }}
                    </a>
                </p>
                
                {{ range .Params.sns }}
                <p>
                    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
                        {{ .username }}
                    </a>
                </p>
                {{ end }}
            </main>
        </div>
    </body>
</html>
